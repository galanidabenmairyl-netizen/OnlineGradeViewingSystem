{% extends "base.html" %}
{% block title %}Add Faculty{% endblock %}
{% block page_title %}Add Faculty Account{% endblock %}
{% block page_subtitle %}Create login credentials for an instructor{% endblock %}

{% block content %}
<div class="card" style="max-width:480px;">
  <form method="POST">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required>

    <label for="full_name">Full Name</label>
    <input type="text" id="full_name" name="full_name" required>

    <label for="position">Position / Designation</label>
    <input type="text" id="position" name="position" value="Faculty" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Temporary Password</label>
    <input type="password" id="password" name="password" required>

    <button class="btn btn-primary" type="submit">Create Account</button>
    <a class="btn btn-outline" href="{{ url_for('admin.faculty_list') }}">Cancel</a>
  </form>
</div>
{% endblock %}
